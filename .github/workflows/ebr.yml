# B-Pharma EBR & Logbook (ebr/): lint, tests on a real PostgreSQL, build, and a start of the built server.
# Runs only when ebr/ or this file changes; the LIMS workflows do not test ebr/, and this one does not test the LIMS.
name: ebr
on:
  push:
    paths: ['ebr/**', '.github/workflows/ebr.yml', 'docs/api/openapi.json']   # the LIMS contract the EBR uses (E30#3)
  pull_request:
    paths: ['ebr/**', '.github/workflows/ebr.yml', 'docs/api/openapi.json']   # the LIMS contract the EBR uses (E30#3)
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ebr
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ebr
          POSTGRES_PASSWORD: ebr
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ebr -d postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_ADMIN_URL: postgres://ebr:ebr@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebr/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run lint
      - name: Tests on PostgreSQL 16 (they fail, never skip, when the database is missing)
        run: npx vitest run --reporter=default --reporter=junit --outputFile.junit=$RUNNER_TEMP/evidence/junit-ci.xml
      - name: Build
        run: npm run build
      - name: Browser for the interface tests
        run: npx playwright install --with-deps chromium
      - name: Interface tests on the built application (tablet 820x1180 and desktop 1440x900)
        run: npx playwright test --reporter=list,junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_NAME: ${{ runner.temp }}/evidence/e2e-ci.xml
      - name: Capacity test (300 users, two instances, one stopped halfway)
        timeout-minutes: 8
        run: npm run test:perf && cp tests/perf/results.json $RUNNER_TEMP/evidence/perf-ci.json
      - name: Evidence of this job for the traceability gate
        uses: actions/upload-artifact@v4
        with: { name: evidence-test, path: '${{ runner.temp }}/evidence/', if-no-files-found: error, retention-days: 30 }
      - name: The built server starts, migrates and answers
        run: |
          psql "postgres://ebr:ebr@127.0.0.1:5432/postgres" -c "create database ebr_ci"
          DATABASE_URL=postgres://ebr:ebr@127.0.0.1:5432/ebr_ci node dist/server/main.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:4100/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:4100/api/health | grep '"status":"ok"' || { cat server.log; exit 1; }

  compose:
    # E19#1: a clean server: docker compose up builds the image, starts PostgreSQL, migrates, creates the first administrator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ebr
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up on a clean runner
        run: |
          printf 'EBR_DB_PASSWORD=ci-database-password\nEBR_BOOTSTRAP_ADMIN_USER=siteadmin\nEBR_BOOTSTRAP_ADMIN_PASSWORD=ci first password 2026\nEBR_COOKIE_SECURE=0\nEBR_PORT=4100\n' > deploy/compose/.env
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:4100/api/health && break; sleep 2; done
          curl -sf http://127.0.0.1:4100/api/health | grep '"status":"ok"'
          curl -sf -H 'content-type: application/json' -d '{"username":"siteadmin","password":"ci first password 2026"}' http://127.0.0.1:4100/api/auth/login | tee login.json
          grep '"mustChangePassword":true' login.json
          # E33: the demo data inside the container, as the run guide (README.md) says
          docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env exec -T -e EBR_DEMO_PASSWORD='ci demo accounts password' app node dist/server/demo/cli.js | tee demo.txt
          grep 'demo data written' demo.txt
          curl -sf -H 'content-type: application/json' -d '{"username":"demo-supervisor","password":"ci demo accounts password"}' http://127.0.0.1:4100/api/auth/login | grep '"username":"demo-supervisor"'
          mkdir -p $RUNNER_TEMP/evidence
          echo "PASS compose-demo the demo data written inside the container; demo-supervisor signs in" > $RUNNER_TEMP/evidence/ci-demo.txt
          echo "PASS compose-up docker compose up on a clean runner: migrations applied, health ok, first administrator signs in (mustChangePassword)" > $RUNNER_TEMP/evidence/ci-compose.txt
      - name: Evidence of this job for the traceability gate
        uses: actions/upload-artifact@v4
        with: { name: evidence-compose, path: '${{ runner.temp }}/evidence/', if-no-files-found: error, retention-days: 30 }
      - name: Logs when it failed
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml --env-file deploy/compose/.env logs --no-color

  windows:
    # E24: the Windows service installation on a Windows Server runner, with PostgreSQL 16 and the pinned WinSW
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
        working-directory: ebr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ebr/package-lock.json
      - name: PostgreSQL 16 (port 5433, beside the image's own PostgreSQL)
        run: |
          choco install postgresql16 --no-progress -y --params '/Password:ebr-ci-windows /Port:5433'
          # options BEFORE the address: psql on Windows ignores options that follow it (seen: "extra command-line argument ignored")
          $psql = 'C:\Program Files\PostgreSQL\16\bin\psql.exe'
          & $psql -v ON_ERROR_STOP=1 -Atc 'select version()' 'postgres://postgres:ebr-ci-windows@127.0.0.1:5433/postgres'
          & $psql -v ON_ERROR_STOP=1 -c 'create database ebr' 'postgres://postgres:ebr-ci-windows@127.0.0.1:5433/postgres'
          if ((& $psql -Atc 'select 1' 'postgres://postgres:ebr-ci-windows@127.0.0.1:5433/ebr') -ne '1') { throw 'the database ebr was not created' }
      - run: npm ci
      - run: npm run build
      - name: WinSW 2.12.0 (its SHA-256 is checked by install-service.ps1)
        run: Invoke-WebRequest -Uri https://github.com/winsw/winsw/releases/download/v2.12.0/WinSW-x64.exe -OutFile deploy/windows/winsw.exe
      - name: Install as a service, first administrator, restart keeps the data, uninstall (E24)
        run: |
          [System.Environment]::OSVersion.VersionString
          (Get-CimInstance Win32_OperatingSystem).Caption
          .\deploy\windows\ci-check.ps1 -DatabaseUrl 'postgres://postgres:ebr-ci-windows@127.0.0.1:5433/ebr' -Psql 'C:\Program Files\PostgreSQL\16\bin\psql.exe' *>&1 | Tee-Object -FilePath ci-windows-raw.txt
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\evidence" | Out-Null
          Get-Content ci-windows-raw.txt | Where-Object { $_ -match '^PASS ' } | Set-Content "$env:RUNNER_TEMP\evidence\ci-windows.txt"
          if ((Get-Content "$env:RUNNER_TEMP\evidence\ci-windows.txt").Count -ne 4) { throw 'expected four PASS lines from ci-check.ps1' }
      - name: Evidence of this job for the traceability gate
        uses: actions/upload-artifact@v4
        with: { name: evidence-windows, path: '${{ runner.temp }}/evidence/', if-no-files-found: error, retention-days: 30 }
      - name: Service logs when it failed
        if: failure()
        run: Get-ChildItem deploy/windows -Filter *.log | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName -Tail 80 }

  traceability:
    # E20#2: the gate over the evidence of THIS run only: the test job (suite, browser, capacity), compose and windows
    needs: [test, compose, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: ebr
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { pattern: 'evidence-*', path: '${{ runner.temp }}/evidence', merge-multiple: true }
      - name: Traceability gate (E20#2) against the results of this run
        run: |
          echo "PASS ci-workflow lint, tests on PostgreSQL 16, build, browser tests and capacity test passed in run $GITHUB_RUN_ID" > $RUNNER_TEMP/evidence/ci-workflow.txt
          ls $RUNNER_TEMP/evidence
          VALIDATION_EVIDENCE=$RUNNER_TEMP/evidence node validation/build/check.cjs

