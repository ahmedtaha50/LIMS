# B-Pharma EBR behind nginx on the factory server: TLS, and requests spread over two (or more) instances.
# Sessions live in the database, so any instance answers any user. A request whose connection an instance refuses (stopped
# for maintenance) goes to the next instance; a request that reached an instance is never sent twice (non-idempotent POSTs
# are retried only on a refused connection, the nginx default since 1.9.13).
upstream ebr {
    server 127.0.0.1:4101 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:4102 max_fails=1 fail_timeout=10s;
    keepalive 32;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ebr.plant.local;                       # the site's name
    ssl_certificate     /etc/nginx/tls/ebr.crt;        # the site's certificate (from the company CA)
    ssl_certificate_key /etc/nginx/tls/ebr.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 2m;

    location / {
        proxy_pass http://ebr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_next_upstream error timeout;              # refused or failed connections only
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name ebr.plant.local;
    return 301 https://$host$request_uri;
}
